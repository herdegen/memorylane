# Journaux Docker bornés (10 Mo × 3 par service) : sans rotation, ils
# grossissaient sans limite (Meilisearch > 150 Mo).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: memorylane_postgres
    logging: *logging
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${DB_DATABASE:-memorylane}
      POSTGRES_USER: ${DB_USERNAME:-memorylane}
      # Pas de valeur par défaut : échoue si DB_PASSWORD n'est pas défini (cf. .env racine)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans le .env racine}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - memorylane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-memorylane}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: memorylane_redis
    logging: *logging
    mem_limit: 1g
    # Au-delà de 768 Mo, évince d'abord les clés expirables (cache, sessions),
    # jamais les files d'attente.
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - memorylane
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Meilisearch Search Engine
  meilisearch:
    # v1.6 → v1.53 : format de données incompatible, d'où un nouveau volume
    # (l'ancien reste pour retour arrière) et une réindexation Scout.
    image: docker.io/getmeili/meilisearch:v1.53.2
    container_name: memorylane_meilisearch
    logging: *logging
    mem_limit: 2g
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY doit être défini dans le .env racine}
      MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_HTTP_ADDR: '0.0.0.0:7700'
    volumes:
      - meilisearch_data_v153:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    networks:
      - memorylane
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Mailpit - boîte mail de dev (attrape tous les mails sortants). Profil
  # « dev » : ne démarre pas en prod (`docker compose --profile dev up -d`).
  mailpit:
    profiles: ["dev"]
    image: docker.io/axllent/mailpit:latest
    container_name: memorylane_mailpit
    logging: *logging
    mem_limit: 256m
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - memorylane
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # PHP-FPM Application
  app:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    container_name: memorylane_app
    logging: *logging
    mem_limit: 3g
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/app/imagemagick-policy.xml:/etc/ImageMagick-7/policy.xml:ro
      - ./docker/app/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - PHP_IDE_CONFIG=serverName=memorylane
      # Republie les assets Livewire/Filament au démarrage (voir docker/app/entrypoint.sh).
      # Uniquement sur `app` : horizon/scheduler partagent l'image mais ne doivent
      # pas republier en concurrence sur public/vendor (volume partagé).
      - PUBLISH_ASSETS=1
    networks:
      - memorylane
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: memorylane_nginx
    logging: *logging
    mem_limit: 256m
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    ports:
      - "${APP_PORT:-8000}:80"
    networks:
      - memorylane
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Traefik n'envoie rien à un conteneur encore « starting » : on sonde
      # toutes les 2 s au démarrage pour réduire la coupure (≈ 45 s sinon).
      start_period: 30s
      start_interval: 2s

  # Laravel Horizon (Queue Worker Dashboard)
  horizon:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    container_name: memorylane_horizon
    logging: *logging
    mem_limit: 4g
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      # Même config PHP que `app` (512M) — sinon les workers tournent au
      # défaut 128M et les gros téléchargements/conversions font OOM.
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/app/imagemagick-policy.xml:/etc/ImageMagick-7/policy.xml:ro
    networks:
      - memorylane
    depends_on:
      - app
      - redis
    restart: unless-stopped

  # Laravel Scheduler
  scheduler:
    build:
      context: ./docker/app
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    container_name: memorylane_scheduler
    logging: *logging
    mem_limit: 1g
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      # Même config PHP que `app` (512M) — cohérence avec le worker horizon.
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/app/imagemagick-policy.xml:/etc/ImageMagick-7/policy.xml:ro
    networks:
      - memorylane
    depends_on:
      - app
    restart: unless-stopped

  # Reconnaissance de visages (InsightFace) : service interne au réseau, CPU
  # seul, aucune photo ne sort du serveur — voir docker/faces.
  faces:
    build:
      context: ./docker/faces
    image: memorylane-faces:1
    container_name: memorylane_faces
    logging: *logging
    mem_limit: 3g
    cpus: 4
    networks:
      - memorylane
    restart: unless-stopped

  # Sauvegarde chiffrée des fichiers (médias + dumps de la base) vers OVH,
  # chaque nuit, test de restauration mensuel — voir docker/backup/backup.sh.
  backup:
    image: docker.io/rclone/rclone:1.75.1
    container_name: memorylane_backup
    logging: *logging
    mem_limit: 512m
    # busybox crond ignore une crontab qui n'appartient pas à root (0600) : le
    # fichier monté (propriétaire de l'hôte) est recopié avec les bons droits.
    # Sans ça, aucune copie nocturne ne partait (dernière : manuelle, 11/10).
    entrypoint: ["sh", "-c", "install -m 600 -o root -g root /crontab.src /etc/crontabs/root && exec crond -f -l 8"]
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./.env:/app/root.env:ro
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/backup/crontab:/crontab.src:ro
      - ./backend/storage/logs:/logs
    networks:
      - memorylane
    restart: unless-stopped

networks:
  memorylane:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
  meilisearch_data_v153:
    driver: local
