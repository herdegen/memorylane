server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # Max body size for large file uploads
    client_max_body_size 2048M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Résolution DNS de `app` à chaque requête (cache 10 s) et non une fois au
    # démarrage : après recréation du conteneur app (nouvelle IP), nginx le
    # retrouve seul au lieu de répondre 502 jusqu'à un reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Livewire dynamic routes
    location ~ ^/livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files
    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Service worker : jamais mis en cache (les navigateurs doivent voir les
    # nouvelles versions — handlers push — dès le déploiement).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|gitignore|gitattributes) {
        deny all;
        return 404;
    }

    # Journaux : sortie standard du conteneur (cf. nginx.conf de l'image),
    # donc bornés par la rotation Docker.
}
