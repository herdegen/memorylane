# En-têtes de sécurité, inclus au niveau du serveur ET dans chaque location
# qui pose ses propres add_header (nginx n'hérite alors plus de ceux du
# serveur). TLS terminé par Traefik : tout le trafic public est en HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Micro (mémos vocaux), caméra et position : seulement pour le site lui-même.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()" always;
