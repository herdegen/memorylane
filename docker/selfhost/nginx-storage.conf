# Stockage intégré (Garage) : les adresses présignées données au navigateur
# pointent vers https://<votre site>/memorylane-files/… (SCALEWAY_PUBLIC_URL).
# nginx les relaie à Garage en lui présentant l'hôte interne pour lequel
# elles ont été signées (garage:3900), sans toucher au chemin ni à la
# requête : la signature reste valide. ^~ : prioritaire sur la règle de cache
# des images (.jpg…), qui servirait sinon un 404 du disque.
location ^~ /memorylane-files/ {
    set $garage_upstream garage:3900;
    proxy_pass http://$garage_upstream;
    proxy_set_header Host garage:3900;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 0;
}
