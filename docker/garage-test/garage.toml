# Garage : faux Scaleway JETABLE pour les tests de stockage (dev uniquement,
# service s3test de docker-compose.dev.yml). Aucun port publié, données en
# mémoire (tmpfs) : ces secrets fixes ne protègent rien de réel.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "8c53ec7ce081a090374b3a9ceaf8cc94bf6201a280f3d1ff0cd314d5b53f98fc"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
