; Pool PHP-FPM de MemoryLane (monté dans le conteneur app).
; Chaque photo affichée passe par PHP (contrôle d'accès puis redirection vers
; le stockage) : 5 workers par défaut saturaient dès 2-3 visiteurs.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle les workers régulièrement (fuites mémoire des extensions image).
pm.max_requests = 500
