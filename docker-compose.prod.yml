# Override production : intégration derrière Traefik (memorylane.maxibestof.com)
# Usage : les vars COMPOSE_FILE du .env racine chargent automatiquement
#         docker-compose.yml + ce fichier. Donc `docker compose up -d` suffit.
#
# Principe : AUCUN port publié sur l'hôte (8000 et 5432 sont déjà pris par
# d'autres stacks). Tout le trafic entrant passe par Traefik via le réseau
# externe `traefik-proxy`. Les services internes ne sont joignables que sur
# le réseau `memorylane`.

services:
  postgres:
    ports: !override []
    restart: unless-stopped

  redis:
    ports: !override []
    restart: unless-stopped

  meilisearch:
    ports: !override []
    restart: unless-stopped
    environment:
      MEILI_ENV: production

  mailpit:
    ports: !override []

  app:
    ports: !override []
    restart: unless-stopped

  nginx:
    # Pas de port publié : Traefik atteint nginx:80 via le réseau traefik-proxy
    ports: !override []
    restart: unless-stopped
    networks:
      - memorylane
      - traefik-proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-proxy"
      # Ancien domaine : redirigé (301) vers memory-lane.fr depuis le 2026-10-11
      # (lien invité expiré, aucune tablette sur l'ancien domaine).
      traefik.http.routers.memorylane.entrypoints: "websecure"
      traefik.http.routers.memorylane.rule: "Host(`memorylane.maxibestof.com`)"
      traefik.http.routers.memorylane.tls.certresolver: "le"
      traefik.http.routers.memorylane.service: "memorylane"
      traefik.http.routers.memorylane.middlewares: "memorylane-olddomain"
      # Domaine principal
      traefik.http.routers.memorylane-fr.entrypoints: "websecure"
      traefik.http.routers.memorylane-fr.rule: "Host(`memory-lane.fr`)"
      traefik.http.routers.memorylane-fr.tls.certresolver: "le"
      traefik.http.routers.memorylane-fr.service: "memorylane"
      # www → domaine nu ; http → https
      traefik.http.routers.memorylane-www.entrypoints: "websecure"
      traefik.http.routers.memorylane-www.rule: "Host(`www.memory-lane.fr`)"
      traefik.http.routers.memorylane-www.tls.certresolver: "le"
      traefik.http.routers.memorylane-www.middlewares: "memorylane-canonical"
      traefik.http.routers.memorylane-www.service: "memorylane"
      traefik.http.routers.memorylane-http.entrypoints: "web"
      traefik.http.routers.memorylane-http.rule: "Host(`memory-lane.fr`) || Host(`www.memory-lane.fr`)"
      traefik.http.routers.memorylane-http.middlewares: "memorylane-canonical"
      traefik.http.routers.memorylane-http.service: "memorylane"
      traefik.http.middlewares.memorylane-canonical.redirectregex.regex: "^https?://(?:www\\.)?memory-lane\\.fr/?(.*)"
      traefik.http.middlewares.memorylane-canonical.redirectregex.replacement: "https://memory-lane.fr/$${1}"
      traefik.http.middlewares.memorylane-canonical.redirectregex.permanent: "true"
      traefik.http.middlewares.memorylane-olddomain.redirectregex.regex: "^https?://memorylane\\.maxibestof\\.com/?(.*)"
      traefik.http.middlewares.memorylane-olddomain.redirectregex.replacement: "https://memory-lane.fr/$${1}"
      traefik.http.middlewares.memorylane-olddomain.redirectregex.permanent: "true"
      traefik.http.services.memorylane.loadbalancer.server.port: "80"
      traefik.http.services.memorylane.loadbalancer.passhostheader: "true"

networks:
  traefik-proxy:
    external: true
