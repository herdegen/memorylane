<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil grand-parent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#92400e}a:hover{color:#78350f}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; padding: 44px 52px; background: #faf7f1; font-family: Figtree, system-ui, sans-serif; color: #1c1917; display: flex; flex-direction: column; gap: 30px">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 26px; color: #57534e">Jeudi 8 octobre</div>
      <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 60px; line-height: 1.05; font-weight: 700">Bonjour Jeanne</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 10px 22px 10px 10px; background: #ffffff; border-radius: 999px; box-shadow: 0 4px 12px rgba(28,25,23,0.08)">
      <div style="width: 60px; height: 60px; border-radius: 999px; background: #e7d8c3; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #78350f">J</div>
      <div style="font-size: 24px; font-weight: 600">C'est moi</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; flex: 1; min-height: 0">

    <a href="Photos.dc.html" style="position: relative; display: block; border-radius: 28px; overflow: hidden; background: #c9b294; text-decoration: none; box-shadow: 0 12px 32px rgba(28,25,23,0.14)">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.75); font-size: 20px; gap: 10px">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-9 7"></path></svg>
        [Photo de famille, été 1978]
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 30px; background: rgba(28,25,23,0.62); color: #ffffff; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 22px; color: #fde68a; font-weight: 600">Il y a 48 ans, jour pour jour</div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 34px; font-weight: 700">La plage de Sainte-Maxime</div>
        <div style="font-size: 22px">avec Pierre, Paul et Marie</div>
      </div>
    </a>

    <div style="display: flex; flex-direction: column; gap: 20px; min-height: 0">
      <div style="flex: 1; background: #ffffff; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 4px 12px rgba(28,25,23,0.08); border: 2px solid #fcd34d">
        <div style="font-size: 22px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.06em">Aujourd'hui</div>
        <div style="display: flex; align-items: center; gap: 18px">
          <div style="width: 92px; height: 92px; border-radius: 999px; background: #d9c7ad; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #57534e">[Photo]</div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 30px; font-weight: 700; line-height: 1.15">Léo a 7 ans</div>
            <div style="font-size: 22px; color: #57534e">votre arrière-petit-fils</div>
          </div>
        </div>
        <button type="button" style="margin-top: auto; height: 88px; border: none; border-radius: 22px; background: #b45309; color: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
          Lui dire bon anniversaire
        </button>
      </div>
    </div>
  </div>

  <nav aria-label="Que voulez-vous faire ?" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <a href="Photos.dc.html" style="height: 150px; border-radius: 28px; background: #ffffff; text-decoration: none; color: #1c1917; display: flex; align-items: center; gap: 22px; padding: 0 30px; box-shadow: 0 4px 12px rgba(28,25,23,0.08); border: 2px solid #e7e5e4">
      <div style="width: 84px; height: 84px; border-radius: 24px; background: #fef3c7; color: #92400e; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-9 7"></path></svg>
      </div>
      <div style="font-size: 30px; font-weight: 700; line-height: 1.15">Regarder les photos</div>
    </a>
    <a href="Famille.dc.html" style="height: 150px; border-radius: 28px; background: #ffffff; text-decoration: none; color: #1c1917; display: flex; align-items: center; gap: 22px; padding: 0 30px; box-shadow: 0 4px 12px rgba(28,25,23,0.08); border: 2px solid #e7e5e4">
      <div style="width: 84px; height: 84px; border-radius: 24px; background: #fef3c7; color: #92400e; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.2c2.8.3 5 2.7 5 5.8"></path></svg>
      </div>
      <div style="font-size: 30px; font-weight: 700; line-height: 1.15">Ma famille</div>
    </a>
    <a href="Raconter.dc.html" style="height: 150px; border-radius: 28px; background: #92400e; text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 22px; padding: 0 30px; box-shadow: 0 4px 12px rgba(28,25,23,0.08)">
      <div style="width: 84px; height: 84px; border-radius: 24px; background: rgba(255,255,255,0.16); color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </div>
      <div style="font-size: 30px; font-weight: 700; line-height: 1.15">Raconter un souvenir</div>
    </a>
  </nav>
</div>
</x-dc>
