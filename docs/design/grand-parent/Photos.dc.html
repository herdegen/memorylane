<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Regarder les photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#92400e}a:hover{color:#78350f}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; padding: 28px 36px 32px; background: #1c1917; font-family: Figtree, system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; gap: 22px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 20px">
    <a href="Main.dc.html" style="height: 76px; padding: 0 30px 0 22px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      Accueil
    </a>
    <div style="font-size: 24px; color: #d6d3d1">Photo {{position}} sur {{total}}</div>
  </div>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px; gap: 20px; align-items: center">
    <button type="button" onClick="{{prev}}" aria-label="Photo précédente" style="height: 120px; width: 120px; border-radius: 999px; border: none; background: rgba(255,255,255,0.14); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="height: 100%; border-radius: 22px; overflow: hidden; background: {{photo.tone}}; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-size: 22px; gap: 12px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 17l-5-5-9 7"></path></svg>
      {{photo.placeholder}}
    </div>
    <button type="button" onClick="{{next}}" aria-label="Photo suivante" style="height: 120px; width: 120px; border-radius: 999px; border: none; background: #fbbf24; color: #1c1917; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 0 140px">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 700; line-height: 1.1">{{photo.title}}</div>
      <div style="font-size: 24px; color: #e7e5e4">{{photo.when}} · {{photo.who}}</div>
    </div>
    <a href="Raconter.dc.html" style="flex-shrink: 0; height: 88px; padding: 0 32px; border-radius: 22px; background: #ffffff; color: #78350f; text-decoration: none; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      Raconter cette photo
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    var photos = [
      { title: 'La plage de Sainte-Maxime', when: 'Été 1978', who: 'avec Pierre, Paul et Marie', tone: '#7d6a55', placeholder: '[Photo de famille à la plage]' },
      { title: 'Le mariage de Paul et Sophie', when: 'Juin 1996', who: 'à Toulon', tone: '#6b6f78', placeholder: '[Photo du mariage]' },
      { title: 'Noël chez Mémé Rose', when: 'Décembre 1962', who: 'avec vos parents', tone: '#6e5a4a', placeholder: '[Photo de Noël en noir et blanc]' }
    ];
    var i = this.state.i;
    var self = this;
    return {
      photo: photos[i],
      position: i + 1,
      total: photos.length,
      prev: function () { self.setState({ i: (i + photos.length - 1) % photos.length }); },
      next: function () { self.setState({ i: (i + 1) % photos.length }); }
    };
  }
}
</script>
</body>
</html>
