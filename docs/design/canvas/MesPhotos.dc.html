<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; background: #faf7f1; color: #44403c; }
    a { color: #b45309; text-decoration: none; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 1440px; display: flex; flex-direction: column">

  <!-- Nav -->
  <div style="height: 64px; background: #ffffff; border-bottom: 1px solid #e7e5e4; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 32px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #fef3c7; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="12" cy="10.5" r="3.5"></circle><path d="M3 16l4-4 3 3 4-5 4 6"></path></svg>
        </div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 18px; color: #1c1917">MemoryLane</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; height: 64px">
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Accueil</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid #f59e0b; color: #1c1917">Mes photos</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Télécharger</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Albums</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Personnes</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Arbre</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Carte</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; width: 250px; padding: 7px 12px; border: 1px solid #d6d3d1; border-radius: 999px; color: #a8a29e; font-size: 13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        Rechercher…
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      <div style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; background: #fef3c7; color: #b45309; font-size: 14px; font-weight: 500">Admin</div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #fef3c7; color: #b45309; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</div>
        <div style="font-size: 14px; font-weight: 500; color: #44403c">Matthieu Herdegen</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
      </div>
    </div>
  </div>

  <!-- Contenu -->
  <div style="width: 1240px; margin: 0 auto; padding: 40px 0 60px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">

    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 40px; color: #1c1917">Mes photos</div>
        <div style="font-size: 15px; color: #78716c; margin-top: 8px">Parcourez vos photos, vidéos et documents</div>
      </div>
      <div style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; background: #d97706; color: #ffffff; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M12 6v12m6-6H6"></path></svg>
        Télécharger
      </div>
    </div>

    <!-- Recherche -->
    <div style="background: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); padding: 16px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid #d6d3d1; border-radius: 6px; color: #78716c; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2"><path stroke-linecap="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        Rechercher dans vos médias...
      </div>
    </div>

    <!-- Galerie -->
    <div style="background: #ffffff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); padding: 24px; display: flex; flex-direction: column; gap: 20px">
      <!-- Onglets -->
      <div style="display: flex; gap: 32px; border-bottom: 1px solid #e7e5e4; font-size: 14px; font-weight: 500">
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 4px; border-bottom: 2px solid #f59e0b; color: #d97706; margin-bottom: -1px">
          Tous
          <span style="padding: 2px 8px; border-radius: 999px; background: #fef3c7; color: #b45309; font-size: 12px">717</span>
        </div>
        <div style="padding: 12px 4px; color: #78716c">Photos</div>
        <div style="padding: 12px 4px; color: #78716c">Vidéos</div>
        <div style="padding: 12px 4px; color: #78716c">Documents</div>
      </div>

      <!-- Année sticky -->
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="padding: 8px 0; border-bottom: 1px solid #f5f5f4; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #78716c">2025</div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
            <div style="position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: {{t.bg}}">
              <div style="position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 6px; background: rgba(255, 255, 255, 0.8); border: 2px solid #ffffff"></div>
              <sc-if value="{{t.video}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.2)">
                  <svg width="44" height="44" viewBox="0 0 24 24" fill="#ffffff" opacity="0.85"><path d="M8 5v14l11-7z"></path></svg>
                </div>
                <div style="position: absolute; top: 8px; left: 8px; display: inline-flex; padding: 3px 7px; border-radius: 6px; background: #ede9fe; color: #6d28d9; font-size: 11px; font-weight: 500">{{t.duration}}</div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; justify-content: center; padding-top: 8px">
        <div style="display: inline-flex; align-items: center; padding: 8px 24px; border-radius: 8px; background: #ffffff; border: 1px solid #d6d3d1; color: #44403c; font-size: 14px; font-weight: 500">Charger plus</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 1440, "height": 1120}}'>
class Component extends DCLogic {
  renderVals() {
    // Placeholders « photos » : dégradés chauds variés (pas de vraies photos
    // de famille dans la maquette).
    const hues = [
      ['#d9c8a9', '#a8927a'], ['#b9c7ad', '#7e9270'], ['#c7d4dc', '#8aa3b4'],
      ['#e2c9b0', '#b08e6a'], ['#ccc2b2', '#948a78'], ['#d6c2c2', '#a08080'],
      ['#c2cfd6', '#7f97a3'], ['#d9d2b8', '#a89f7a'], ['#c9b9a5', '#8f7f6b'],
      ['#b5c4bc', '#748c80'], ['#d8c4ac', '#a8846a'], ['#c4bfd4', '#8c86a5'],
    ];
    return {
      tiles: hues.map(([a, b], i) => ({
        bg: 'linear-gradient(155deg, ' + a + ', ' + b + ')',
        video: i === 1,
        duration: '0:51',
      })),
    };
  }
}
</script>
</body>
</html>
