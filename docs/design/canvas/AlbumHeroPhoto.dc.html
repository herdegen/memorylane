<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; background: #faf7f1; color: #44403c; }
    a { color: #b45309; text-decoration: none; } a:hover { color: #92400e; }
  </style>
</helmet>
<div style="width: 1440px; display: flex; flex-direction: column">

  <!-- Nav -->
  <div style="height: 64px; background: #ffffff; border-bottom: 1px solid #e7e5e4; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 32px">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: #fef3c7; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="12" cy="10.5" r="3.5"></circle><path d="M3 16l4-4 3 3 4-5 4 6"></path></svg>
        </div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 18px; color: #1c1917">MemoryLane</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; height: 64px">
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Accueil</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Mes photos</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Télécharger</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid #f59e0b; color: #1c1917">Albums</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Personnes</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Arbre</div>
        <div style="padding: 22px 4px 20px; border-bottom: 2px solid transparent; color: #78716c">Carte</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; width: 250px; padding: 7px 12px; border: 1px solid #d6d3d1; border-radius: 999px; color: #a8a29e; font-size: 13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        Rechercher…
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      <div style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; background: #fef3c7; color: #b45309; font-size: 14px; font-weight: 500">Admin</div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #fef3c7; color: #b45309; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</div>
        <div style="font-size: 14px; font-weight: 500; color: #44403c">Matthieu Herdegen</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
      </div>
    </div>
  </div>

  <!-- Héro : photo de couverture assombrie, pleine largeur -->
  <div style="position: relative; height: 340px; overflow: visible">
    <div style="position: absolute; inset: 0; background: linear-gradient(160deg, #7d94a8 0%, #a8b8a0 45%, #c9b88f 100%); overflow: hidden">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23, 20, 15, 0.35) 0%, rgba(23, 20, 15, 0.15) 40%, rgba(23, 20, 15, 0.72) 100%)"></div>
    </div>

    <!-- Actions flottantes (haut droite) -->
    <div style="position: absolute; top: 20px; right: 32px; display: flex; align-items: center; gap: 10px">
      <div style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #1c1917; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(28, 25, 23, 0.2)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        Diaporama
      </div>
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #1c1917; box-shadow: 0 4px 12px rgba(28, 25, 23, 0.2)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M8.7 10.7l6.6-3.4m-6.6 6.1l6.6 3.4"></path></svg>
      </div>
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); color: #1c1917; box-shadow: 0 4px 12px rgba(28, 25, 23, 0.2)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="12" cy="19" r="1.2"></circle></svg>
      </div>
    </div>

    <!-- Menu déroulant ouvert (montré pour la maquette) -->
    <div style="position: absolute; top: 68px; right: 32px; width: 224px; background: #ffffff; border: 1px solid #f5f5f4; border-radius: 12px; box-shadow: 0 12px 32px rgba(28, 25, 23, 0.22); padding: 4px 0; z-index: 5">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; color: #44403c">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M12 4v16m8-8H4"></path></svg>
        Ajouter des médias
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; color: #44403c">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        Sélectionner
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; color: #44403c">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><circle cx="12" cy="11" r="3"></circle></svg>
        Géolocaliser
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; color: #44403c">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        Modifier
      </div>
      <div style="border-top: 1px solid #f5f5f4; margin: 4px 0"></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13px; color: #dc2626">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        Supprimer l'album
      </div>
    </div>

    <!-- Titre + fil d'ariane (bas gauche) -->
    <div style="position: absolute; left: 32px; right: 32px; bottom: 28px; display: flex; align-items: center; gap: 18px">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.35); color: #ffffff; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255, 255, 255, 0.75)">Albums</div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 46px; color: #ffffff; text-shadow: 0 2px 12px rgba(23, 20, 15, 0.4)">Bretagne Août 2009</div>
        <div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: rgba(255, 255, 255, 0.85)">
          28 médias
          <span style="display: inline-flex; padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; font-size: 12px; font-weight: 500">Privé</span>
          <span>Saint-Malo, Bretagne</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Galerie pleine largeur, mosaïque bord à bord -->
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 230px; grid-auto-flow: dense; gap: 4px; padding: 4px; box-sizing: border-box">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="14">
      <div style="position: relative; overflow: hidden; background: {{t.bg}}; grid-column: span {{t.c}}; grid-row: span {{t.r}}; border-radius: 2px">
        <sc-if value="{{t.video}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.2)">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="#ffffff" opacity="0.85"><path d="M8 5v14l11-7z"></path></svg>
          </div>
          <div style="position: absolute; top: 10px; left: 10px; display: inline-flex; padding: 3px 7px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #ffffff; font-size: 11px; font-weight: 500">0:30</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 1440, "height": 1350}}'>
class Component extends DCLogic {
  renderVals() {
    // Mosaïque : quelques tuiles en 2x2 / 2x1 pour casser la grille uniforme.
    const spec = [
      { c: 2, r: 2, h: ['#aebfcf', '#6e8ba3'] },
      { c: 1, r: 1, h: ['#cdd8c2', '#93a882'] },
      { c: 1, r: 1, h: ['#d9c8a9', '#a8927a'] },
      { c: 2, r: 1, h: ['#c7ccd4', '#8b95a5'] },
      { c: 1, r: 1, h: ['#d8c4ac', '#a8846a'] },
      { c: 1, r: 1, h: ['#bcccd2', '#7d9aa5'], video: true },
      { c: 2, r: 1, h: ['#d0c6b4', '#9a8d75'] },
      { c: 1, r: 1, h: ['#b9c7ad', '#7e9270'] },
      { c: 1, r: 1, h: ['#d6c2c2', '#a08080'] },
      { c: 2, r: 2, h: ['#c2cfd6', '#7f97a3'] },
      { c: 1, r: 1, h: ['#ccc2b2', '#948a78'] },
      { c: 1, r: 1, h: ['#c9b9a5', '#8f7f6b'] },
      { c: 1, r: 1, h: ['#b5c4bc', '#748c80'] },
      { c: 1, r: 1, h: ['#e0d3be', '#b09a72'] },
    ];
    return {
      tiles: spec.map((s) => ({
        c: s.c,
        r: s.r,
        video: !!s.video,
        bg: 'linear-gradient(155deg, ' + s.h[0] + ', ' + s.h[1] + ')',
      })),
    };
  }
}
</script>
</body>
</html>
