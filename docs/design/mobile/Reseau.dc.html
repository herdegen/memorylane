<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réseau du cercle sur mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#faf7f1;color:#44403c}
a{color:#0f766e;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf7f1">

  <!-- Mode amis : accent teal, onglet « Amis » -->
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 54px 8px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 2; background: #faf7f1">
    <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c1917">Amis</h1>
    <button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid #5eead4; background: #ccfbf1; font-size: 13px; font-weight: 600; color: #1c1917">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: #0d9488; color: #ffffff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">CL</span>
      La bande à milou
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 106px; z-index: 2; display: flex; border-radius: 999px; background: #e7e5e4; padding: 3px">
    <a href="Proches.dc.html" style="flex: 1; height: 36px; font-size: 14px; font-weight: 600; color: #57534e; display: inline-flex; align-items: center; justify-content: center">Amis</a>
    <span style="flex: 1; height: 36px; border-radius: 999px; background: #ffffff; font-size: 14px; font-weight: 700; color: #1c1917; display: inline-flex; align-items: center; justify-content: center">Réseau</span>
    <span style="flex: 1; height: 36px; font-size: 14px; font-weight: 600; color: #57534e; display: inline-flex; align-items: center; justify-content: center">Carte</span>
  </div>

  <!-- Graphe égo : moi au centre, pincer/glisser -->
  <div style="position: absolute; left: 0; right: 0; top: 150px; height: 470px">
    <div style="position: absolute; left: 55px; top: 60px; width: 280px; height: 280px; border-radius: 999px; border: 1px dashed #e7e5e4"></div>
    <sc-for list="{{edges}}" as="e" hint-placeholder-count="9"><div style="{{e.style}}"></div></sc-for>
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
      <button type="button" onClick="{{n.pick}}" aria-label="{{n.name}}" style="{{n.style}}">{{n.initials}}</button>
      <div style="{{n.labelStyle}}">{{n.name}}</div>
    </sc-for>
  </div>

  <!-- Feuille : la personne touchée -->
  <div style="position: absolute; left: 0; right: 0; bottom: 86px; background: #ffffff; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 30px -14px rgba(68,45,20,.3); padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: #d6d3d1; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 48px; height: 48px; border-radius: 999px; background: {{sel.color}}; color: #ffffff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{sel.initials}}</span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 700; color: #1c1917">{{sel.name}}</span><span style="display: block; font-size: 13px; color: #57534e">{{sel.meta}}</span></span>
      <a href="FichePersonne.dc.html" aria-label="Voir la fiche" style="width: 44px; height: 44px; border-radius: 999px; background: #0f766e; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
    <div style="font-size: 14px; color: #1c1917; background: #f0fdfa; border-radius: 12px; padding: 10px 12px; line-height: 1.4">{{sel.story}}</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border-radius: 10px; overflow: hidden">
      <span style="display: block; aspect-ratio: 1; background: #d6d3d1"></span><span style="display: block; aspect-ratio: 1; background: #a8a29e"></span><span style="display: block; aspect-ratio: 1; background: #78716c"></span><span style="display: block; aspect-ratio: 1; background: #e7e5e4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #57534e">+{{sel.more}}</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #ffffff; border-top: 1px solid #e7e5e4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 22px; box-sizing: border-box">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"></path></svg>Accueil</a>
    <a href="Photos.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Photos</a>
    <a href="Ajouter.dc.html" aria-label="Ajouter des photos" style="display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; margin-top: -26px; border-radius: 999px; background: #0d9488; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgba(13,148,136,.7)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a href="Albums.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M7 3h10"></path></svg>Albums</a>
    <a href="Proches.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0f766e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19a6 6 0 0112 0M15 19a4 4 0 016 0"></path></svg>Amis</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 'damien' }; }
  renderVals() {
    const P = [
      ['damien','Damien','#0f766e',48,'Même classe de seconde, puis colocs en 2011.'],['aurele','Aurèle','#0f766e',62,'Rencontré par Damien à Bruges, en 2008.'],['laura','Laura','#0f766e',30,''],
      ['pierre','Pierre-Henry','#0f766e',34,''],['marionl','Marion L.','#9333ea',20,'Autre cercle : Les Ponzes'],['julien','Julien','#0f766e',44,''],['sophie','Sophie','#9333ea',12,'Autre cercle : Les Ponzes'],['nico','Nicolas','#0f766e',18,''],
    ];
    const cx = 195, cy = 200;
    const nodes = [], edges = [];
    P.forEach((p, i) => {
      const ang = (i / P.length) * Math.PI * 2 - Math.PI / 2;
      const dist = 140 - Math.min(40, p[3] / 2.5);
      const x = Math.round(cx + Math.cos(ang) * dist), y = Math.round(cy + Math.sin(ang) * dist);
      const r = Math.round(16 + Math.sqrt(p[3]) * 1.4);
      const isSel = p[0] === this.state.sel;
      const h = Math.max(1, Math.min(6, Math.round(p[3] / 12)));
      const len = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
      edges.push({ style: 'position:absolute;left:' + cx + 'px;top:' + (cy - h / 2) + 'px;width:' + Math.round(len) + 'px;height:' + h + 'px;border-radius:4px;background:' + (isSel ? p[2] : '#e7e5e4') + ';transform:rotate(' + (Math.atan2(y - cy, x - cx) * 180 / Math.PI).toFixed(1) + 'deg);transform-origin:0 50%;' });
      nodes.push({ name: p[1], initials: p[1].slice(0, 2), pick: () => this.setState({ sel: p[0] }),
        style: 'position:absolute;left:' + (x - r) + 'px;top:' + (y - r) + 'px;width:' + (2 * r) + 'px;height:' + (2 * r) + 'px;border-radius:999px;border:' + (p[2] === '#9333ea' ? '2px dashed #ffffff' : '2px solid #ffffff') + ';padding:0;background:' + p[2] + ';color:#ffffff;font-size:12px;font-weight:700;box-shadow:' + (isSel ? '0 0 0 3px ' + p[2] : '0 2px 6px -2px rgba(0,0,0,.25)') + ';',
        labelStyle: 'position:absolute;left:' + (x - 44) + 'px;top:' + (y + r + 2) + 'px;width:88px;text-align:center;font-size:11px;font-weight:600;color:#1c1917;pointer-events:none;' });
    });
    nodes.push({ name: 'Moi', initials: 'Moi', pick: () => {}, style: 'position:absolute;left:' + (cx - 30) + 'px;top:' + (cy - 30) + 'px;width:60px;height:60px;border-radius:999px;border:3px solid #ffffff;padding:0;background:#1c1917;color:#ffffff;font-size:13px;font-weight:700;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);', labelStyle: 'display:none;' });
    const s = P.find((p) => p[0] === this.state.sel) || P[0];
    return { nodes, edges, sel: { name: s[1], initials: s[1].slice(0, 2), color: s[2], meta: s[3] + ' photos ensemble', story: s[4] || 'Pas encore raconté — touchez pour écrire comment vous vous êtes connus.', more: Math.max(0, s[3] - 3) } };
  }
}
</script>
</body>
</html>
