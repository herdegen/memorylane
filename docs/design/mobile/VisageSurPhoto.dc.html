<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Identifier un visage sur la photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#0c0a09;color:#44403c}
a{color:#b45309;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0c0a09">

  <!-- Photo avec les visages : tap sur un cadre -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 420px; background: linear-gradient(160deg, #78716c 0%, #44403c 60%, #1c1917 100%)"></div>
  <a href="Visionneuse.dc.html" aria-label="Retour" style="position: absolute; left: 8px; top: 50px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ffffff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  <span style="position: absolute; right: 12px; top: 58px; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,.55); color: #ffffff; font-size: 12px; font-weight: 700">{{progress}}</span>

  <sc-for list="{{faces}}" as="f" hint-placeholder-count="4">
    <button type="button" onClick="{{f.pick}}" aria-label="{{f.label}}" style="{{f.style}}">
      <span style="{{f.tagStyle}}">{{f.tag}}</span>
    </button>
  </sc-for>

  <!-- Feuille : le visage choisi, en grand, et qui c'est -->
  <div style="position: absolute; left: 0; right: 0; top: 392px; bottom: 0; background: #faf7f1; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 14px; padding: 10px 16px 20px">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: #d6d3d1; align-self: center"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 88px; height: 88px; border-radius: 22px; background: {{sel.crop}}; border: 3px solid #f59e0b; flex: none"></div>
      <div style="flex: 1; min-width: 0">
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; color: #1c1917">{{sel.title}}</div>
        <div style="font-size: 13px; color: #78716c; margin-top: 2px">{{sel.sub}}</div>
      </div>
    </div>

    <!-- Suggestions : bulles, la plus probable en premier -->
    <sc-if value="{{sel.open}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px; overflow: hidden">
        <sc-for list="{{sel.suggestions}}" as="s" hint-placeholder-count="3">
          <button type="button" onClick="{{s.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 74px; flex: none; border: none; background: transparent">
            <span style="position: relative; width: 60px; height: 60px; border-radius: 999px; background: {{s.color}}; color: #ffffff; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 3px solid {{s.ring}}">{{s.initials}}<span style="position: absolute; right: -6px; bottom: -4px; padding: 2px 6px; border-radius: 999px; background: #1c1917; color: #ffffff; font-size: 10px; font-weight: 800">{{s.pct}} %</span></span>
            <span style="font-size: 12px; font-weight: 700; color: #1c1917; max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.name}}</span>
          </button>
        </sc-for>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 74px; flex: none; border: none; background: transparent">
          <span style="width: 60px; height: 60px; border-radius: 999px; border: 2px dashed #d6d3d1; display: inline-flex; align-items: center; justify-content: center; color: #57534e"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
          <span style="font-size: 12px; font-weight: 700; color: #57534e">Nouveau</span>
        </button>
      </div>
      <div style="position: relative">
        <svg style="position: absolute; left: 14px; top: 14px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="search" placeholder="Ou cherchez un nom…" aria-label="Chercher une personne" style="width: 100%; height: 46px; padding: 0 14px 0 40px; border: 1px solid #d6d3d1; border-radius: 14px; background: #ffffff; font-size: 15px; box-sizing: border-box">
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{sel.reject}}" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 14px; font-weight: 600; color: #44403c">Inconnu</button>
        <button type="button" onClick="{{sel.reject}}" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 14px; font-weight: 600; color: #44403c">Pas un visage</button>
      </div>
    </sc-if>
    <sc-if value="{{sel.done}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #dcfce7; color: #166534; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>{{sel.doneText}}</div>
      <a href="FichePersonne.dc.html" style="font-size: 14px; font-weight: 600">Voir sa fiche</a>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <button type="button" onClick="{{allUnknown}}" style="height: 44px; border-radius: 12px; border: 1px dashed #d6d3d1; background: transparent; font-size: 14px; font-weight: 600; color: #57534e">Personne de connu sur cette photo</button>
      <a href="Album.dc.html" style="text-align: center; font-size: 13px; font-weight: 600">Dire qui était là (tout l'album)</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 2, named: { 0: 'Marion', 1: 'Matthieu' } }; }
  renderVals() {
    const faces = [
      { x: 38, y: 36, w: 46, crop: 'radial-gradient(circle at 50% 40%, #e7e5e4, #78716c)', sug: [] },
      { x: 56, y: 40, w: 44, crop: 'radial-gradient(circle at 50% 40%, #d6d3d1, #57534e)', sug: [] },
      { x: 76, y: 44, w: 42, crop: 'radial-gradient(circle at 50% 40%, #d6d3d1, #a8a29e 50%, #57534e)', sug: [{ name: 'Christian', initials: 'CP', color: '#2563eb', pct: 81 }, { name: 'Bastien', initials: 'BP', color: '#2563eb', pct: 64 }, { name: 'Yves', initials: 'YG', color: '#c2410c', pct: 31 }] },
      { x: 20, y: 52, w: 36, crop: 'radial-gradient(circle at 50% 40%, #a8a29e, #44403c)', sug: [{ name: 'Élodie', initials: 'EP', color: '#c2410c', pct: 58 }] },
    ];
    const named = this.state.named;
    const sel = this.state.sel;
    const f = faces[sel];
    const total = faces.length;
    const doneCount = Object.keys(named).length;
    const isNamed = named[sel] !== undefined;
    return {
      progress: doneCount + ' / ' + total + ' identifiés',
      faces: faces.map((x, k) => {
        const n = named[k];
        const active = k === sel;
        return {
          label: n ? n : 'Visage à identifier',
          pick: () => this.setState({ sel: k }),
          style: 'position:absolute;left:' + x.x + '%;top:' + (x.y * 4.2) + 'px;width:' + x.w + 'px;height:' + (x.w * 1.2) + 'px;margin-left:-' + (x.w / 2) + 'px;border-radius:10px;border:' + (active ? '3px solid #f59e0b' : (n ? '2px solid #86efac' : '2px solid rgba(255,255,255,.85)')) + ';background:transparent;box-shadow:' + (active ? '0 0 0 4px rgba(245,158,11,.35),0 0 0 9999px rgba(0,0,0,.25)' : 'none') + ';padding:0;',
          tag: n ? n : '?',
          tagStyle: 'position:absolute;left:50%;top:100%;transform:translate(-50%,4px);padding:2px 7px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;background:' + (n ? '#86efac' : '#f59e0b') + ';color:#1c1917;',
        };
      }),
      sel: {
        crop: f.crop,
        title: isNamed ? named[sel] : 'Qui est-ce ?',
        sub: isNamed ? 'Touchez un autre cadre pour continuer' : (f.sug.length ? 'Ressemble à ' + f.sug[0].name : 'Aucune ressemblance connue'),
        open: !isNamed, done: isNamed, doneText: named[sel] + ' identifié·e sur cette photo',
        suggestions: f.sug.map((s, i) => ({ ...s, ring: i === 0 ? '#f59e0b' : '#ffffff', pick: () => this.setState({ named: { ...named, [sel]: s.name } }) })),
        reject: () => this.setState({ named: { ...named, [sel]: 'Inconnu' } }),
      },
      allUnknown: () => this.setState({ named: Object.fromEntries(faces.map((_, k) => [k, named[k] ?? 'Inconnu'])) }),
    };
  }
}
</script>
</body>
</html>
