<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Galerie Photos mobile</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#faf7f1;color:#44403c}
a{color:#b45309;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf7f1">

  <!-- Barre du haut : titre + actions -->
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 54px 8px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 2; background: #faf7f1">
    <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c1917">Photos <span style="font-family: Figtree, sans-serif; font-size: 14px; font-weight: 600; color: #78716c">2 970</span></h1>
    <div style="display: flex">
      <button type="button" aria-label="Rechercher" style="width: 44px; height: 44px; border: none; background: transparent; color: #44403c; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
      <button type="button" style="height: 36px; margin: 4px 0; padding: 0 14px; border-radius: 999px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 14px; font-weight: 600; color: #1c1917">Sélectionner</button>
    </div>
  </div>

  <!-- Filtres : une seule rangée qui défile -->
  <div style="position: absolute; left: 0; right: 0; top: 104px; padding: 8px 16px 10px; display: flex; gap: 8px; overflow: hidden; z-index: 2; background: #faf7f1">
    <span style="display: inline-flex; border-radius: 999px; background: #e7e5e4; padding: 3px; flex: none"><span style="height: 30px; padding: 0 12px; border-radius: 999px; background: #ffffff; font-size: 13px; font-weight: 700; color: #1c1917; display: inline-flex; align-items: center">Tout</span><span style="height: 30px; padding: 0 12px; font-size: 13px; font-weight: 600; color: #57534e; display: inline-flex; align-items: center">Photos</span><span style="height: 30px; padding: 0 12px; font-size: 13px; font-weight: 600; color: #57534e; display: inline-flex; align-items: center">Vidéos</span></span>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #fcd34d; background: #fef3c7; font-size: 13px; font-weight: 600; color: #92400e; flex: none; display: inline-flex; align-items: center; gap: 6px">Marion ×</button>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 13px; font-weight: 600; color: #44403c; flex: none; display: inline-flex; align-items: center; gap: 6px">Personnes <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 13px; font-weight: 600; color: #44403c; flex: none">Tags</button>
  </div>

  <!-- Grille bord à bord, 3 colonnes, mois en séparateurs -->
  <div style="position: absolute; left: 0; right: 0; top: 158px; bottom: 86px; overflow: hidden; display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 6px 16px 4px; display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px; font-weight: 700; color: #1c1917">Septembre 2026</span><span style="font-size: 12px; color: #78716c">48 photos</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <div style="aspect-ratio: 1; background: #a8a29e; position: relative"><span style="position: absolute; left: 6px; bottom: 6px; display: inline-flex; gap: -4px"><span style="width: 18px; height: 18px; border-radius: 999px; background: #d97706; border: 2px solid #ffffff"></span></span></div>
      <div style="aspect-ratio: 1; background: #78716c"></div>
      <div style="aspect-ratio: 1; background: #d6d3d1; position: relative"><span style="position: absolute; right: 6px; top: 6px; padding: 2px 6px; border-radius: 6px; background: rgba(28,25,23,.7); color: #ffffff; font-size: 11px; font-weight: 700">0:42</span></div>
      <div style="aspect-ratio: 1; background: #57534e"></div>
      <div style="aspect-ratio: 1; background: #e7e5e4"></div>
      <div style="aspect-ratio: 1; background: #a8a29e"></div>
    </div>
    <div style="padding: 10px 16px 4px; display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px; font-weight: 700; color: #1c1917">Août 2026</span><span style="font-size: 12px; color: #78716c">131 photos</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <div style="aspect-ratio: 1; background: #d6d3d1"></div>
      <div style="aspect-ratio: 1; background: #78716c"></div>
      <div style="aspect-ratio: 1; background: #a8a29e"></div>
      <div style="aspect-ratio: 1; background: #57534e"></div>
      <div style="aspect-ratio: 1; background: #d6d3d1"></div>
      <div style="aspect-ratio: 1; background: #e7e5e4"></div>
      <div style="aspect-ratio: 1; background: #a8a29e"></div>
      <div style="aspect-ratio: 1; background: #78716c"></div>
      <div style="aspect-ratio: 1; background: #d6d3d1"></div>
    </div>
    <div style="padding: 10px 16px 4px"><span style="font-size: 15px; font-weight: 700; color: #1c1917">Juillet 2026</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <div style="aspect-ratio: 1; background: #a8a29e"></div>
      <div style="aspect-ratio: 1; background: #e7e5e4"></div>
      <div style="aspect-ratio: 1; background: #57534e"></div>
    </div>
  </div>

  <!-- Curseur d'années (apparaît pendant le défilement) -->
  <div style="position: absolute; right: 4px; top: 200px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 3">
    <span style="padding: 6px 10px; border-radius: 999px; background: #1c1917; color: #ffffff; font-size: 12px; font-weight: 700">2026</span>
    <span style="width: 3px; height: 360px; border-radius: 999px; background: #d6d3d1; margin-right: 10px"></span>
  </div>

  <!-- Barre d'onglets -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #ffffff; border-top: 1px solid #e7e5e4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 22px; box-sizing: border-box">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"></path></svg>Accueil</a>
    <a href="Photos.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #b45309"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Photos</a>
    <a href="Ajouter.dc.html" aria-label="Ajouter des photos" style="display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; margin-top: -26px; border-radius: 999px; background: #d97706; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgba(217,119,6,.7)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
    <a href="Albums.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M7 3h10"></path></svg>Albums</a>
    <a href="Proches.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #78716c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19a6 6 0 0112 0M15 19a4 4 0 016 0"></path></svg>Proches</a>
  </div>
</div>
</x-dc>
