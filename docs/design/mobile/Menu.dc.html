<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cercles et compte (feuille)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#faf7f1;color:#44403c}
a{color:#b45309;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf7f1">

  <!-- Accueil en dessous, assombri -->
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; padding: 110px 16px 0"><div style="font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c1917">Bonjour Matthieu</div><div style="margin-top: 16px; height: 100px; border-radius: 20px; background: #1c1917"></div></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(28,25,23,.5)"></div>

  <!-- Feuille : d'abord les cercles (la bascule), puis le compte -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #faf7f1; border-radius: 24px 24px 0 0; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 50px rgba(0,0,0,.35)">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: #d6d3d1; align-self: center"></div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 52px; border-radius: 999px; background: #b45309; color: #ffffff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">MH</span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 700; color: #1c1917">Matthieu Herdegen</span><span style="display: block; font-size: 13px; color: #78716c">Administrateur · ma fiche reliée</span></span>
      <a href="Accueil.dc.html" aria-label="Fermer" style="width: 36px; height: 36px; border-radius: 999px; background: #e7e5e4; color: #44403c; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 18L18 6M6 6l12 12"></path></svg></a>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #78716c">Mes cercles</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{circles}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" style="{{c.style}}">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: {{c.soft}}; color: {{c.color}}; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none">{{c.initials}}</span>
          <span style="flex: 1; min-width: 0; text-align: left"><span style="display: block; font-size: 15px; font-weight: 700; color: #1c1917">{{c.name}}</span><span style="display: block; font-size: 12px; color: #78716c">{{c.meta}}</span></span>
          <sc-if value="{{c.active}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="2.8" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg></sc-if>
        </button>
      </sc-for>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 10px; border-radius: 14px; border: 1px dashed #d6d3d1; background: transparent; font-size: 14px; font-weight: 600; color: #57534e">
        <span style="width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Créer un cercle d'amis
      </button>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #78716c; margin-top: 4px">Mon compte</div>
    <div style="background: #ffffff; border: 1px solid #e7e5e4; border-radius: 16px; overflow: hidden">
      <a href="FichePersonne.dc.html" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; color: #1c1917; font-size: 15px; font-weight: 600; border-bottom: 1px solid #f5f5f4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0116 0"></path></svg>Ma fiche<span style="margin-left: auto; color: #a8a29e">›</span></a>
      <span style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; color: #1c1917; font-size: 15px; font-weight: 600; border-bottom: 1px solid #f5f5f4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" aria-hidden="true"><path d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"></path></svg>Notifications<span style="margin-left: auto; width: 44px; height: 26px; border-radius: 999px; background: #d97706; position: relative"><span style="position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 999px; background: #ffffff"></span></span></span>
      <span style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; color: #1c1917; font-size: 15px; font-weight: 600; border-bottom: 1px solid #f5f5f4"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" aria-hidden="true"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>Mode sombre<span style="margin-left: auto; font-size: 13px; font-weight: 500; color: #78716c">Automatique</span></span>
      <span style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; color: #1c1917; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.1 9a3 3 0 015.8 1c0 2-3 2-3 4M12 17h.01"></path></svg>Guide d'utilisation<span style="margin-left: auto; color: #a8a29e">›</span></span>
    </div>
    <a href="Accueil.dc.html" style="text-align: center; font-size: 14px; font-weight: 600; color: #b91c1c; padding: 6px">Se déconnecter</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { current: 'fk' }; }
  renderVals() {
    const defs = [
      { id: 'fk', name: 'Famille Kormann', kind: 'family', initials: 'FK', meta: 'Famille · 4 membres · 347 fiches' },
      { id: 'cl', name: 'La bande à milou', kind: 'friends', initials: 'CL', meta: 'Amis · 9 membres · 10 fiches' },
      { id: 'lp', name: 'Les Ponzes', kind: 'friends', initials: 'LP', meta: 'Amis · 12 membres · 11 fiches' },
    ];
    return {
      circles: defs.map((d) => {
        const f = d.kind === 'family';
        const active = d.id === this.state.current;
        return { ...d, active, color: f ? '#b45309' : '#0f766e', soft: f ? '#fef3c7' : '#ccfbf1',
          style: 'display:flex;align-items:center;gap:12px;height:60px;padding:0 10px;border-radius:14px;border:1px solid ' + (active ? (f ? '#fcd34d' : '#5eead4') : '#e7e5e4') + ';background:' + (active ? (f ? '#fffbeb' : '#f0fdfa') : '#ffffff') + ';',
          pick: () => this.setState({ current: d.id }) };
      }),
    };
  }
}
</script>
</body>
</html>
