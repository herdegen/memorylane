<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter des photos (feuille)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#faf7f1;color:#44403c}
a{color:#b45309;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf7f1">

  <!-- Page en dessous (galerie, assombrie) -->
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #faf7f1">
    <div style="padding: 54px 16px 0"><div style="font-family: 'Playfair Display', Georgia, serif; font-size: 26px; color: #1c1917">Photos</div></div>
    <div style="margin-top: 60px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <div style="aspect-ratio: 1; background: #a8a29e"></div><div style="aspect-ratio: 1; background: #78716c"></div><div style="aspect-ratio: 1; background: #d6d3d1"></div>
      <div style="aspect-ratio: 1; background: #57534e"></div><div style="aspect-ratio: 1; background: #e7e5e4"></div><div style="aspect-ratio: 1; background: #a8a29e"></div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(28,25,23,.5)"></div>

  <!-- Feuille « Ajouter » depuis le bouton + -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #faf7f1; border-radius: 24px 24px 0 0; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 50px rgba(0,0,0,.35)">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: #d6d3d1; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; color: #1c1917">Ajouter des souvenirs</div>
      <a href="Photos.dc.html" aria-label="Fermer" style="width: 36px; height: 36px; border-radius: 999px; background: #e7e5e4; color: #44403c; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 18L18 6M6 6l12 12"></path></svg></a>
    </div>

    <!-- Deux grandes entrées -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 120px; border-radius: 20px; border: none; background: #d97706; color: #ffffff; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; padding: 14px; text-align: left; box-shadow: 0 14px 30px -14px rgba(217,119,6,.8)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>
        <span style="font-size: 16px; font-weight: 700">Mes photos</span>
        <span style="font-size: 12px; opacity: .9">Choisir dans la galerie du téléphone</span>
      </button>
      <button type="button" style="height: 120px; border-radius: 20px; border: 1px solid #d6d3d1; background: #ffffff; color: #1c1917; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px; padding: 14px; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span style="font-size: 16px; font-weight: 700">Prendre une photo</span>
        <span style="font-size: 12px; color: #78716c">Ou scanner une photo papier</span>
      </button>
    </div>

    <!-- Où ranger : réglages avant l'envoi -->
    <div style="background: #ffffff; border: 1px solid #e7e5e4; border-radius: 16px; overflow: hidden">
      <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; background: transparent; text-align: left">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #fef3c7; color: #b45309; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M7 3h10"></path></svg></span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600; color: #1c1917">Ranger dans un album</span><span style="display: block; font-size: 12px; color: #78716c">Aucun · touchez pour choisir ou créer</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <div style="height: 1px; background: #e7e5e4; margin: 0 14px"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #fef3c7; color: #b45309; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19a6 6 0 0112 0M15 19a4 4 0 016 0"></path></svg></span>
        <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 600; color: #1c1917">Partager avec Famille Kormann</span><span style="display: block; font-size: 12px; color: #78716c">Sinon, les photos restent pour vous</span></span>
        <span style="width: 48px; height: 28px; border-radius: 999px; background: #d97706; position: relative; flex: none"><span style="position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 999px; background: #ffffff"></span></span>
      </div>
    </div>

    <!-- Autres sources -->
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 13px; font-weight: 600; color: #1c1917">Google Photos</button>
      <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 13px; font-weight: 600; color: #1c1917">Google Drive</button>
      <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #d6d3d1; background: #ffffff; font-size: 13px; font-weight: 600; color: #1c1917">Un document</button>
    </div>

    <!-- Envoi en cours (bannière persistante, on peut naviguer) -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #1c1917; color: #ffffff">
      <span style="display: inline-flex"><span style="width: 32px; height: 32px; border-radius: 8px; background: #78716c; border: 2px solid #1c1917"></span><span style="width: 32px; height: 32px; border-radius: 8px; background: #a8a29e; border: 2px solid #1c1917; margin-left: -10px"></span><span style="width: 32px; height: 32px; border-radius: 8px; background: #d6d3d1; border: 2px solid #1c1917; margin-left: -10px"></span></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 700">Envoi · 18 sur 42</span><span style="display: block; height: 4px; border-radius: 999px; background: rgba(255,255,255,.2); margin-top: 6px; overflow: hidden"><span style="display: block; width: 43%; height: 100%; background: #f59e0b"></span></span></span>
      <span style="font-size: 12px; color: #d6d3d1; flex: none">Continuez à naviguer</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
